services:
  reservation-db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: program
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reservation-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U program -d reservations"]
      interval: 2s
      timeout: 3s
      retries: 30
  reservation:
    image: lab2-reservation
    build:
      context: .
      dockerfile: services/reservation/Dockerfile
    volumes:
      - ./services/reservation/config.docker.yaml:/app/config.yaml:ro
      - ./services/reservation/migrations.yaml:/app/migrations.yaml:ro
    ports:
      - "127.0.0.1:8070:8070"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8070/manage/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      reservation-db:
        condition: service_healthy
  payment:
    image: lab2-payment
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    volumes:
      - ./services/payment/config.docker.yaml:/app/config.yaml:ro
      - ./services/payment/migrations.yaml:/app/migrations.yaml:ro
    ports:
      - "127.0.0.1:8060:8060"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8060/manage/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      reservation-db:
        condition: service_healthy
  loyalty:
    image: lab2-loyalty
    build:
      context: .
      dockerfile: services/loyalty/Dockerfile
    volumes:
      - ./services/loyalty/config.docker.yaml:/app/config.yaml:ro
      - ./services/loyalty/migrations.yaml:/app/migrations.yaml:ro
    ports:
      - "127.0.0.1:8050:8050"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8050/manage/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      reservation-db:
        condition: service_healthy
  gateway:
    image: lab2-gateway
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    volumes:
      - ./services/gateway/config.docker.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/manage/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      reservation:
        condition: service_healthy
      payment:
        condition: service_healthy
      loyalty:
        condition: service_healthy
volumes:
  reservation-data:
