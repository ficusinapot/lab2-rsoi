enrichment_concurrency: 4
http:
  api_prefix: /api/v1
  address: "127.0.0.1:58080"
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  request_timeout: 5s
  shutdown_timeout: 10s
  max_body_bytes: 4096
metrics:
  path: /metrics
  service: gateway
  version: "test"
  latency_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
openapi:
  title: Gateway Service
  version: "1.0.0"
  docs_path: /docs
  schema_path: /openapi
logging:
  level: error
  stdout:
    level: error
  files: []
clients:
  max_in_flight: 32
  max_idle_connections: 64
  max_idle_connections_per_host: 16
  idle_connection_timeout: 60s
  reservation_url: http://localhost:8070/api/v1
  payment_url: http://localhost:8060/api/v1
  loyalty_url: http://localhost:8050/api/v1
  timeout: 5s
